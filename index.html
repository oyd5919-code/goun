<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고운음악학원 · 리듬 & 계이름 놀이</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  body {
    background: linear-gradient(135deg, #fff6eb 0%, #ffe9f0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    color: #2d2926;
  }
  .app {
    background: #ffffff;
    width: 100%;
    max-width: 580px;
    border-radius: 28px;
    box-shadow: 0 14px 40px rgba(180, 120, 100, 0.16);
    padding: 24px 20px 26px;
    text-align: center;
    border: 3px solid #ffe0cc;
  }
  .badge {
    display: inline-block;
    background: #fff1dc;
    color: #b5651d;
    font-weight: 700;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  h1 { font-size: 23px; margin-bottom: 6px; color: #2d2926; }
  .sub { font-size: 14px; color: #7a7067; margin-bottom: 16px; }

  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: #f8f2ec;
    padding: 5px;
    border-radius: 16px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 8px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    color: #7c7066;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active {
    background: #ffffff;
    color: #d96b27;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }

  .mode-grid {
    display: grid;
    gap: 10px;
  }
  .mode-btn {
    border: 2.5px solid #f0dfd1;
    background: #fffaf5;
    border-radius: 18px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.12s, border-color 0.15s, background 0.15s;
  }
  .mode-btn:hover { transform: translateY(-2px); border-color: #f39c6b; background: #fff3e8; }
  .mode-title { font-size: 16.5px; font-weight: 800; color: #2d2926; margin-bottom: 2px; }
  .mode-desc { font-size: 12.5px; color: #776c63; line-height: 1.35; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .pill {
    background: #f7f1eb;
    padding: 6px 12px;
    border-radius: 99px;
    color: #5c5148;
  }
  .score-pill { background: #fff2cc; color: #9c6a00; }
  .back-btn {
    background: none;
    border: none;
    font-size: 14px;
    color: #8b7e74;
    cursor: pointer;
    font-weight: 700;
  }

  .card-stage {
    background: #fffcf7;
    border: 2.5px solid #efe3d5;
    border-radius: 22px;
    padding: 14px 12px;
    margin-bottom: 14px;
  }
  .q-prompt { font-size: 17px; font-weight: 800; margin-bottom: 6px; color: #3a312b; }
  .svg-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 165px;
  }
  .sound-btn {
    margin-top: 6px;
    background: #eef6ff;
    border: 1.5px solid #b9d7fa;
    color: #2563eb;
    border-radius: 99px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .choices.three-col { grid-template-columns: repeat(3, 1fr); }
  .choices.four-col { grid-template-columns: repeat(4, 1fr); }
  .choice-btn {
    background: #ffffff;
    border: 2.5px solid #e6dacd;
    border-radius: 16px;
    padding: 14px 8px;
    font-size: 16.5px;
    font-weight: 800;
    color: #2d2926;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
  }
  .choice-btn:hover:not(:disabled) { background: #fff6ed; border-color: #f0a875; transform: scale(1.02); }
  .choice-btn.correct { background: #dff7ea; border-color: #34a86e; color: #166534; }
  .choice-btn.wrong { background: #ffe5e3; border-color: #e05a4f; color: #991b1b; }

  .feedback {
    min-height: 44px;
    margin-top: 12px;
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    border-radius: 14px;
  }
  .fb-ok { background: #eafaf1; color: #1f7a4c; }
  .fb-no { background: #fff0ee; color: #c0392b; }

  .next-btn {
    margin-top: 10px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 16px;
    background: #ff8c5a;
    color: white;
    font-size: 16.5px;
    font-weight: 800;
    cursor: pointer;
  }
  .next-btn:hover { background: #f27a46; }

  .hidden { display: none; }
  .trophy { font-size: 62px; margin: 10px 0; }
</style>
</head>
<body>
<div class="app">
  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="badge">🎹 고운음악학원 음악 놀이</div>
    <h1>리듬 · 계이름 마스터 게임!</h1>
    <p class="sub">원하는 놀이를 고르고 단계를 선택해 보세요 🎵</p>

    <div class="tab-row">
      <button class="tab-btn active" id="tab-rhythm" onclick="switchTab('rhythm')">🥁 리듬 놀이</button>
      <button class="tab-btn" id="tab-pitch" onclick="switchTab('pitch')">🎼 계이름 놀이</button>
    </div>

    <!-- RHYTHM MODES -->
    <div id="rhythm-modes" class="mode-grid">
      <button class="mode-btn" onclick="startGame('rhythm', 'kind')">
        <div class="mode-title">1단계 · 음표일까? 쉼표일까?</div>
        <div class="mode-desc">소리를 내는 '음표'와 쉬어가는 '쉼표'를 구별해요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('rhythm', 'name')">
        <div class="mode-title">2단계 · 음표·쉼표 이름 맞히기</div>
        <div class="mode-desc">온음표, 2분음표, 4분음표, 8분음표와 쉼표 이름을 골라요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('rhythm', 'beat')">
        <div class="mode-title">3단계 · 몇 박자일까요?</div>
        <div class="mode-desc">반 박(0.5박)부터 4박까지 박자 수를 맞혀요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('rhythm', 'mix')">
        <div class="mode-title">⭐ 4단계 · 리듬 종합 왕중왕전</div>
        <div class="mode-desc">음표·쉼표 구별 + 이름 + 박자가 섞여서 나와요!</div>
      </button>
    </div>

    <!-- PITCH MODES -->
    <div id="pitch-modes" class="mode-grid hidden">
      <button class="mode-btn" onclick="startGame('pitch', 'three_c')">
        <div class="mode-title">1단계 · 도 자리 세 개 찾기</div>
        <div class="mode-desc">낮은 도 · 가온 도 · 높은 도 위치를 정확히 구별해요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('pitch', 'treble_mid')">
        <div class="mode-title">2단계 · 높은음자리표 (가온 도 ~ 윗덧줄 전)</div>
        <div class="mode-desc">가온 도부터 오선 맨 위 솔까지 기본 계이름을 익혀요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('pitch', 'treble_high')">
        <div class="mode-title">3단계 · 높은음자리표 위덧줄 (높은 도 ~ 윗덧줄 3개)</div>
        <div class="mode-desc">높은 도부터 윗덧줄 3개(미)까지 높은 음을 읽어요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('pitch', 'treble_low')">
        <div class="mode-title">4단계 · 높은음자리표 아래덧줄 (가온 도 ~ 아래덧줄 2개)</div>
        <div class="mode-desc">가온 도에서 내려가는 시·라(아래덧줄 2개)까지 익혀요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('pitch', 'bass_all')">
        <div class="mode-title">5단계 · 낮은음자리표 (기본 + 위·아래덧줄)</div>
        <div class="mode-desc">낮은 도·가온 도부터 아래덧줄·위덧줄까지 왼손 악보를 읽어요!</div>
      </button>
      <button class="mode-btn" onclick="startGame('pitch', 'pitch_mix')">
        <div class="mode-title">⭐ 6단계 · 계이름 종합 왕중왕전</div>
        <div class="mode-desc">높은음자리표 + 낮은음자리표 + 모든 덧줄이 다 나와요!</div>
      </button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <div class="top-bar">
      <button class="back-btn" onclick="goHome()">← 처음으로</button>
      <span class="pill" id="progress-pill">1 / 10</span>
      <span class="pill score-pill" id="score-pill">⭐ 0점</span>
    </div>

    <div class="card-stage">
      <div class="q-prompt" id="q-prompt">이 기호는 무엇일까요?</div>
      <div class="svg-wrap" id="svg-wrap"></div>
      <button class="sound-btn" id="sound-btn" onclick="playCurrentSound()">🔊 소리 들어보기</button>
    </div>

    <div class="choices" id="choices"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="next-btn hidden" id="next-btn" onclick="nextQuestion()">다음 문제 →</button>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="hidden">
    <div class="trophy" id="trophy-icon">🏆</div>
    <h1 id="result-title">참 잘했어요!</h1>
    <p class="sub" id="result-desc"></p>
    <button class="next-btn" onclick="startGame(currentGameType, currentMode)">한 번 더 하기 🔁</button>
    <button class="choice-btn" id="result-home-btn" style="width:100%; margin-top:10px;" onclick="goHome()">단계 고르기로 가기</button>
  </div>
</div>

<script>
// ========================
// 1. 리듬 SVG & 데이터
// ========================
function rhythmStaffSvg(inner) {
  const lines = [48, 64, 80, 96, 112].map(y =>
    `<line x1="25" y1="${y}" x2="255" y2="${y}" stroke="#c9bfb4" stroke-width="2"/>`
  ).join('');
  return `<svg width="280" height="155" viewBox="0 0 280 155" xmlns="http://www.w3.org/2000/svg">${lines}${inner}</svg>`;
}

const RHYTHM_ITEMS = [
  { id:'whole_note', kind:'음표', name:'온음표', beat:'4박자', beatsNum:4,
    hint:'속이 하얗고 기둥이 없는 동그라미는 4박자 온음표예요!',
    svg: rhythmStaffSvg(`<ellipse cx="140" cy="88" rx="14" ry="10" fill="#fffcf7" stroke="#2d2926" stroke-width="4.5" transform="rotate(-15 140 88)"/>`) },
  { id:'dotted_half_note', kind:'음표', name:'점2분음표', beat:'3박자', beatsNum:3,
    hint:'하얀 음표 옆에 점(.)이 붙으면 2박+1박 = 3박자 점2분음표예요!',
    svg: rhythmStaffSvg(`<ellipse cx="132" cy="88" rx="12" ry="9" fill="#fffcf7" stroke="#2d2926" stroke-width="4" transform="rotate(-20 132 88)"/><line x1="143" y1="86" x2="143" y2="34" stroke="#2d2926" stroke-width="4" stroke-linecap="round"/><circle cx="157" cy="88" r="4.5" fill="#2d2926"/>`) },
  { id:'half_note', kind:'음표', name:'2분음표', beat:'2박자', beatsNum:2,
    hint:'하얀 머리 + 기둥이 있으면 2박자 2분음표예요!',
    svg: rhythmStaffSvg(`<ellipse cx="136" cy="88" rx="12" ry="9" fill="#fffcf7" stroke="#2d2926" stroke-width="4" transform="rotate(-20 136 88)"/><line x1="147" y1="86" x2="147" y2="34" stroke="#2d2926" stroke-width="4" stroke-linecap="round"/>`) },
  { id:'quarter_note', kind:'음표', name:'4분음표', beat:'1박자', beatsNum:1,
    hint:'까만 머리 + 기둥이 있으면 1박자 4분음표예요!',
    svg: rhythmStaffSvg(`<ellipse cx="136" cy="88" rx="12" ry="9" fill="#2d2926" transform="rotate(-20 136 88)"/><line x1="147" y1="86" x2="147" y2="34" stroke="#2d2926" stroke-width="4" stroke-linecap="round"/>`) },
  { id:'eighth_note', kind:'음표', name:'8분음표', beat:'반 박(0.5박)', beatsNum:0.5,
    hint:'까만 머리에 기둥과 꼬리가 1개 달려 있으면 반 박자 8분음표예요!',
    svg: rhythmStaffSvg(`<ellipse cx="132" cy="88" rx="12" ry="9" fill="#2d2926" transform="rotate(-20 132 88)"/><line x1="143" y1="86" x2="143" y2="34" stroke="#2d2926" stroke-width="4" stroke-linecap="round"/><path d="M143 34 C164 44, 165 62, 152 74" fill="none" stroke="#2d2926" stroke-width="4" stroke-linecap="round"/>`) },
  { id:'whole_rest', kind:'쉼표', name:'온쉼표', beat:'4박자', beatsNum:4,
    hint:'4째 줄 아래에 거꾸로 매달린 모양(세숫대야 모양)이 4박자 온쉼표예요!',
    svg: rhythmStaffSvg(`<rect x="122" y="64" width="36" height="10" fill="#2d2926" rx="2"/>`) },
  { id:'half_rest', kind:'쉼표', name:'2분쉼표', beat:'2박자', beatsNum:2,
    hint:'3째 줄 위에 모자처럼 올라앉은 모양이 2박자 2분쉼표예요!',
    svg: rhythmStaffSvg(`<rect x="122" y="70" width="36" height="10" fill="#2d2926" rx="2"/>`) },
  { id:'quarter_rest', kind:'쉼표', name:'4분쉼표', beat:'1박자', beatsNum:1,
    hint:'번개처럼 지그재그 모양은 1박자 4분쉼표예요!',
    svg: rhythmStaffSvg(`<path d="M136 48 L149 64 L134 78 L148 94 C136 98, 132 106, 144 112" fill="none" stroke="#2d2926" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`) },
  { id:'eighth_rest', kind:'쉼표', name:'8분쉼표', beat:'반 박(0.5박)', beatsNum:0.5,
    hint:'동그란 점 하나에 빗금이 쓱 내려온 모양은 반 박자 8분쉼표예요!',
    svg: rhythmStaffSvg(`<circle cx="132" cy="66" r="6" fill="#2d2926"/><path d="M134 68 Q144 71 150 62 L138 104" fill="none" stroke="#2d2926" stroke-width="4.5" stroke-linecap="round"/>`) }
];

// ========================
// 2. 계이름 SVG & 데이터
// ========================
// 5선보: Line1(bottom)=120, Line2=106, Line3=92, Line4=78, Line5(top)=64 (step=7px)
function pitchStaffSvg(clef, pos) {
  const lines = [64, 78, 92, 106, 120].map(y =>
    `<line x1="25" y1="${y}" x2="255" y2="${y}" stroke="#bfb4a8" stroke-width="2"/>`
  ).join('');

  // 음자리표 SVG (크로스플랫폼 100% 호환)
  let clefSvg = '';
  if (clef === 'treble') {
    clefSvg = `
      <g transform="translate(36, 48) scale(0.95)">
        <path d="M22 86 C12 86, 8 78, 13 72 C17 67, 24 71, 22 77 C20 82, 13 82, 13 75
                 M22 86 C32 86, 36 74, 30 62 C25 53, 14 54, 12 63 C10 71, 18 77, 26 73
                 C33 69, 34 57, 25 48 C18 41, 16 26, 23 12 C27 4, 31 8, 29 18
                 L19 95 C18 103, 11 105, 8 100"
          fill="none" stroke="#3c342e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>`;
  } else {
    clefSvg = `
      <g transform="translate(38, 64)">
        <circle cx="12" cy="14" r="5" fill="#3c342e"/>
        <path d="M10 14 C12 2, 32 0, 34 16 C35 30, 22 44, 8 52"
          fill="none" stroke="#3c342e" stroke-width="4" stroke-linecap="round"/>
        <circle cx="43" cy="8" r="3.2" fill="#3c342e"/>
        <circle cx="43" cy="22" r="3.2" fill="#3c342e"/>
      </g>`;
  }

  const noteX = 165;
  const noteY = 120 - pos * 7;

  // 덧줄 (pos >= 10 위, pos <= -2 아래)
  let ledgers = '';
  if (pos >= 10) {
    for (let p = 10; p <= pos; p += 2) {
      const ly = 120 - p * 7;
      ledgers += `<line x1="${noteX - 20}" y1="${ly}" x2="${noteX + 20}" y2="${ly}" stroke="#5a5048" stroke-width="2.2"/>`;
    }
  }
  if (pos <= -2) {
    for (let p = -2; p >= pos; p -= 2) {
      const ly = 120 - p * 7;
      ledgers += `<line x1="${noteX - 20}" y1="${ly}" x2="${noteX + 20}" y2="${ly}" stroke="#5a5048" stroke-width="2.2"/>`;
    }
  }

  // 음표 (온음표 스타일 또는 4분음표 스타일 — 가독성을 위해 4분음표 기둥 포함)
  const stemUp = pos < 4;
  const stem = stemUp
    ? `<line x1="${noteX + 10}" y1="${noteY - 2}" x2="${noteX + 10}" y2="${noteY - 40}" stroke="#2d2926" stroke-width="3.2" stroke-linecap="round"/>`
    : `<line x1="${noteX - 10}" y1="${noteY + 2}" x2="${noteX - 10}" y2="${noteY + 40}" stroke="#2d2926" stroke-width="3.2" stroke-linecap="round"/>`;

  const noteHead = `<ellipse cx="${noteX}" cy="${noteY}" rx="11" ry="8" fill="#2d2926" transform="rotate(-18 ${noteX} ${noteY})"/>`;

  return `<svg width="280" height="175" viewBox="0 0 280 175" xmlns="http://www.w3.org/2000/svg">
    ${lines}${clefSvg}${ledgers}${noteHead}${stem}
  </svg>`;
}

// 음높이 Hz 계산
const NOTE_HZ = {
  C2:65.41, D2:73.42, E2:82.41, F2:87.31, G2:98.00, A2:110.00, B2:123.47,
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C6:1046.50, D6:1174.66, E6:1318.51
};

// 계이름 데이터셋 생성 헬퍼
function mkNote(clef, pos, solfege, pitchKey, cLabel, hint) {
  return { clef, pos, solfege, pitchKey, hz: NOTE_HZ[pitchKey], cLabel: cLabel || solfege, hint, svg: pitchStaffSvg(clef, pos) };
}

// 1) 도 자리 세 개 찾기
const THREE_C_ITEMS = [
  mkNote('bass', 3, '도', 'C3', '낮은 도', '낮은음자리표 아래에서 2번째 칸은 낮은 도예요!'),
  mkNote('treble', -2, '도', 'C4', '가온 도', '높은음자리표 아래덧줄 1개는 가온 도예요!'),
  mkNote('bass', 10, '도', 'C4', '가온 도', '낮은음자리표 위덧줄 1개도 가온 도예요!'),
  mkNote('treble', 5, '도', 'C5', '높은 도', '높은음자리표 아래에서 3번째 칸은 높은 도예요!')
];

// 2) 높은음자리표: 가온 도(C4) ~ 윗덧줄 전 솔(G5)
const TREBLE_MID = [
  mkNote('treble', -2, '도', 'C4', null, '아래덧줄 1개는 가온 도예요!'),

  mkNote('bass', 12, '미', 'E4', null, '낮은음자리표 위덧줄 2개는 미예요!')

const SOLFEGE_ALL = ['도', '레', '미', '파', '솔', '라', '시'];
const ALL_RHYTHM_NAMES = RHYTHM_ITEMS.map(i => i.name);
const ALL_BEATS = ['4박자', '3박자', '2박자', '1박자', '반 박(0.5박)'];

// ========================
// 3. 상태 및 오디오
// ========================
let currentTab = 'rhythm';
let currentGameType = 'rhythm';
let currentMode = 'kind';
let questions = [];
let qIndex = 0;
let score = 0;
let answered = false;

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, startTime, duration, type='triangle', vol=0.25) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}
function sfxCorrect() {
  const ctx = getCtx(); const now = ctx.currentTime;
  playTone(523.25, now, 0.14, 'triangle', 0.25);
  playTone(659.25, now + 0.1, 0.14, 'triangle', 0.25);
  playTone(783.99, now + 0.2, 0.28, 'triangle', 0.28);
}
function sfxWrong() {
  const ctx = getCtx(); const now = ctx.currentTime;
  playTone(260, now, 0.18, 'sine', 0.2);
  playTone(220, now + 0.15, 0.25, 'sine', 0.2);
}
function playCurrentSound() {
  const q = questions[qIndex];
  const ctx = getCtx(); const now = ctx.currentTime;
  if (currentGameType === 'rhythm') {
    const beatSec = 0.55;
    if (q.item.kind === '음표') {
      playTone(523.25, now, q.item.beatsNum * beatSec, 'triangle', 0.25);
    } else {
      const count = Math.max(1, Math.ceil(q.item.beatsNum));
      for (let i = 0; i < count; i++) playTone(880, now + i * beatSec, 0.06, 'sine', 0.12);
    }
  } else {
    playTone(q.item.hz, now, 0.75, 'triangle', 0.3);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-rhythm').classList.toggle('active', tab === 'rhythm');
  document.getElementById('tab-pitch').classList.toggle('active', tab === 'pitch');
  document.getElementById('rhythm-modes').classList.toggle('hidden', tab !== 'rhythm');
  document.getElementById('pitch-modes').classList.toggle('hidden', tab !== 'pitch');
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function buildRhythmQuestions(mode) {
  const list = [];
  for (let i = 0; i < 10; i++) {
    const item = RHYTHM_ITEMS[Math.floor(Math.random() * RHYTHM_ITEMS.length)];
    let askType = mode === 'mix' ? ['kind', 'name', 'beat'][i % 3] : mode;
    let prompt = '', correct = '', options = [];
    if (askType === 'kind') {
      prompt = '이 친구는 음표일까요, 쉼표일까요?';
      correct = item.kind;
      options = ['음표 🎵', '쉼표 🤫'];
    } else if (askType === 'name') {
      prompt = '이 기호의 이름은 무엇일까요?';
      correct = item.name;
      options = shuffle([correct, ...shuffle(ALL_RHYTHM_NAMES.filter(n => n !== correct)).slice(0, 3)]);
    } else {
      prompt = '이 기호는 몇 박자일까요?';
      correct = item.beat;
      options = shuffle([correct, ...shuffle(ALL_BEATS.filter(b => b !== correct)).slice(0, 3)]);
    }
    list.push({ item, prompt, correct, options, colClass: '' });
  }
  return list;
}

function buildPitchQuestions(mode) {
  let pool = [];
  if (mode === 'three_c') pool = THREE_C_ITEMS;
  else if (mode === 'treble_mid') pool = TREBLE_MID;
  else if (mode === 'treble_high') pool = TREBLE_HIGH;
  else if (mode === 'treble_low') pool = TREBLE_LOW;
  else if (mode === 'bass_all') pool = BASS_ALL;
  else pool = [...TREBLE_MID, ...TREBLE_HIGH, ...TREBLE_LOW, ...BASS_ALL];

  const list = [];
  for (let i = 0; i < 10; i++) {
    const item = pool[Math.floor(Math.random() * pool.length)];
    if (mode === 'three_c') {
      list.push({
        item,
        prompt: '어느 자리의 "도"일까요?',
        correct: item.cLabel,
        options: ['낮은 도', '가온 도', '높은 도'],
        colClass: 'three-col'
      });
    } else {
      list.push({
        item,
        prompt: '이 음표의 계이름은 무엇일까요?',
        correct: item.solfege,
        options: SOLFEGE_ALL,
        colClass: 'four-col'
      });
    }
  }
  return list;
}

function startGame(gameType, mode) {
  currentGameType = gameType;
  currentMode = mode;
  questions = gameType === 'rhythm' ? buildRhythmQuestions(mode) : buildPitchQuestions(mode);
  qIndex = 0;
  score = 0;
  document.getElementById('home-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  renderQuestion();
}

function goHome() {
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}

function renderQuestion() {
  answered = false;
  const q = questions[qIndex];
  document.getElementById('progress-pill').textContent = `${qIndex + 1} / ${questions.length}`;
  document.getElementById('score-pill').textContent = `⭐ ${score}점`;
  document.getElementById('q-prompt').textContent = q.prompt;
  document.getElementById('svg-wrap').innerHTML = q.item.svg;
  document.getElementById('sound-btn').textContent =
    currentGameType === 'rhythm' ? '🔊 박자 소리 들어보기' : '🎹 피아노 음 높이 들어보기';
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  const choicesEl = document.getElementById('choices');
  choicesEl.className = 'choices ' + (q.colClass || '');
  choicesEl.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(btn, opt) {
  if (answered) return;
  answered = true;
  const q = questions[qIndex];
  const cleanOpt = opt.replace(' 🎵', '').replace(' 🤫', '');
  const isRight = cleanOpt === q.correct;

  document.querySelectorAll('#choices .choice-btn').forEach(b => {
    b.disabled = true;
    const cleanB = b.textContent.replace(' 🎵', '').replace(' 🤫', '');
    if (cleanB === q.correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden', 'fb-ok', 'fb-no');

  if (isRight) {
    score += 10;
    document.getElementById('score-pill').textContent = `⭐ ${score}점`;
    btn.classList.add('correct');
    fb.classList.add('fb-ok');
    fb.textContent = currentGameType === 'rhythm'
      ? `정답! 🎉 ${q.item.name} (${q.item.beat})`
      : `정답! 🎉 ${q.item.cLabel || q.item.solfege}`;
    sfxCorrect();
  } else {
    btn.classList.add('wrong');
    fb.classList.add('fb-no');
    fb.textContent = `아쉬워요! ${q.item.hint}`;
    sfxWrong();
  }

  if (currentGameType === 'pitch') {
    setTimeout(() => playCurrentSound(), 180);
  }

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = qIndex === questions.length - 1 ? '결과 보기 🏆' : '다음 문제 →';
  nextBtn.classList.remove('hidden');
}

function nextQuestion() {
  if (qIndex < questions.length - 1) {
    qIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  const icon = score >= 80 ? '🏆' : score >= 50 ? '🌟' : '🌱';
  const title = score >= 80 ? '최고의 음악 박사님!' : score >= 50 ? '아주 잘했어요!' : '조금만 더 연습해 봐요!';
  document.getElementById('trophy-icon').textContent = icon;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-desc').textContent = `10문제 중 ${score / 10}문제를 맞혀서 총 ${score}점을 받았어요!`;
}
</script>
