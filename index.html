<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고운음악학원 · 음악 놀이 놀이터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  body {
    background: linear-gradient(135deg, #fff6eb 0%, #ffe9f0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 14px;
    color: #2d2926;
  }
  .app {
    background: #ffffff;
    width: 100%;
    max-width: 600px;
    border-radius: 26px;
    box-shadow: 0 14px 40px rgba(180, 120, 100, 0.16);
    padding: 20px 16px 24px;
    text-align: center;
    border: 3px solid #ffe0cc;
    margin: 8px 0;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .badge {
    display: inline-block;
    background: #fff1dc;
    color: #b5651d;
    font-weight: 800;
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 99px;
  }
  .rank-open-btn {
    background: #fff7d6;
    border: 1.5px solid #f0d77b;
    color: #966600;
    font-weight: 800;
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 99px;
    cursor: pointer;
  }
  h1 { font-size: 22px; margin-bottom: 4px; color: #2d2926; }
  .sub { font-size: 13.5px; color: #7a7067; margin-bottom: 12px; }

  .player-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #fff9f2;
    border: 2px solid #f2dfc8;
    border-radius: 16px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .player-bar label { font-size: 13px; font-weight: 800; color: #73563d; white-space: nowrap; }
  .player-select {
    flex: 1;
    border: 1.5px solid #e6cdb2;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 700;
    background: #fff;
    color: #2d2926;
  }

  .section-label {
    font-size: 12px;
    font-weight: 800;
    color: #9b8878;
    text-align: left;
    margin: 4px 2px 6px;
    letter-spacing: 0.2px;
  }
  .tab-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
    background: #f5ebe0;
    padding: 8px;
    border-radius: 20px;
    border: 2px solid #ecd9c6;
  }
  .tab-btn {
    border: 2px solid #e6d6c6;
    background: #ffffff;
    padding: 12px 8px;
    border-radius: 15px;
    font-size: 15.5px;
    font-weight: 900;
    color: #5d5148;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    transition: transform 0.12s, background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .tab-btn:hover { transform: translateY(-1px); border-color: #f39c6b; }
  .tab-btn .tab-ico { font-size: 20px; line-height: 1; }
  .tab-btn.active {
    background: linear-gradient(135deg, #ff8a4c, #eb6a2b);
    border-color: #d95a1e;
    color: #ffffff;
    box-shadow: 0 5px 14px rgba(235, 106, 43, 0.34);
    transform: translateY(-1px);
  }

  .mode-grid { display: grid; gap: 8px; }
  .mode-btn {
    border: 1.5px solid #efe3d7;
    background: #fffdfb;
    border-radius: 14px;
    padding: 11px 13px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.1s, border-color 0.15s, background 0.15s;
  }
  .mode-btn:hover { transform: translateY(-1px); border-color: #f39c6b; background: #fff6ee; }
  .mode-title { font-size: 14.5px; font-weight: 800; color: #3a322d; margin-bottom: 2px; }
  .mode-desc { font-size: 12px; color: #84786e; line-height: 1.35; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .pill { background: #f7f1eb; padding: 6px 12px; border-radius: 99px; color: #5c5148; }
  .score-pill { background: #fff2cc; color: #9c6a00; }
  .back-btn {
    background: none; border: none; font-size: 14px; color: #8b7e74; cursor: pointer; font-weight: 700;
  }

  .card-stage {
    background: #fffcf7;
    border: 2.5px solid #efe3d5;
    border-radius: 20px;
    padding: 14px 10px;
    margin-bottom: 12px;
  }
  .q-prompt { font-size: 16.5px; font-weight: 800; margin-bottom: 6px; color: #3a312b; }
  .svg-wrap { display: flex; justify-content: center; align-items: center; min-height: 155px; }
  .symbol-big { font-size: 56px; font-weight: 900; color: #2d2926; font-family: Georgia, serif; }
  .sound-btn {
    margin-top: 6px;
    background: #eef6ff;
    border: 1.5px solid #b9d7fa;
    color: #2563eb;
    border-radius: 99px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .choices.three-col { grid-template-columns: repeat(3, 1fr); }
  .choices.four-col { grid-template-columns: repeat(4, 1fr); }
  .choice-btn {
    background: #ffffff;
    border: 2.5px solid #e6dacd;
    border-radius: 15px;
    padding: 13px 6px;
    font-size: 15.5px;
    font-weight: 800;
    color: #2d2926;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
  }
  .choice-btn:hover:not(:disabled) { background: #fff6ed; border-color: #f0a875; }
  .choice-btn.correct { background: #dff7ea; border-color: #34a86e; color: #166534; }
  .choice-btn.wrong { background: #ffe5e3; border-color: #e05a4f; color: #991b1b; }

  .feedback {
    min-height: 42px;
    margin-top: 11px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    border-radius: 13px;
  }
  .fb-ok { background: #eafaf1; color: #1f7a4c; }
  .fb-no { background: #fff0ee; color: #c0392b; }

  .primary-btn {
    margin-top: 10px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 16px;
    background: #ff8c5a;
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  .primary-btn:hover { background: #f27a46; }
  .secondary-btn {
    width: 100%;
    margin-top: 9px;
    background: #ffffff;
    border: 2.5px solid #e6dacd;
    border-radius: 15px;
    padding: 12px;
    font-size: 15.5px;
    font-weight: 800;
    color: #2d2926;
    cursor: pointer;
  }

  /* MEMORY GAME */
  .mem-players {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mem-pbox {
    flex: 1;
    padding: 8px 10px;
    border-radius: 14px;
    border: 2px solid #e6dacd;
    background: #fffaf5;
    font-size: 13.5px;
    font-weight: 800;
  }
  .mem-pbox.active-turn {
    border-color: #ff8c5a;
    background: #fff0e5;
    color: #c2410c;
    box-shadow: 0 2px 10px rgba(255,140,90,0.2);
  }
  .mem-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .mem-card {
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    border: 2.5px solid #e6dacd;
    background: linear-gradient(135deg, #ffe5d1, #ffd6e0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px;
    font-weight: 800;
    font-size: 14px;
    color: #9a6544;
    user-select: none;
    transition: transform 0.15s;
  }
  .mem-card.flipped {
    background: #ffffff;
    border-color: #f39c6b;
    color: #2d2926;
  }
  .mem-card.matched {
    background: #eafaf1;
    border-color: #34a86e;
    color: #166534;
    cursor: default;
  }
  .mem-card svg { max-width: 88px; max-height: 70px; }

  /* RHYTHM TAP GAME */
  .tap-pad {
    width: 100%;
    height: 115px;
    border-radius: 22px;
    border: 3px solid #f39c6b;
    background: linear-gradient(180deg, #fff5eb, #ffe3cc);
    font-size: 20px;
    font-weight: 900;
    color: #b54515;
    cursor: pointer;
    margin-top: 8px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .tap-pad.holding { transform: scale(0.97); background: #ffc99e; border-color: #e05a2b; }
  .beat-dots { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
  .beat-dot { width: 16px; height: 16px; border-radius: 50%; background: #e5d8ca; }
  .beat-dot.lit { background: #ff7a45; transform: scale(1.25); }

  /* RANKING */
  .rank-list { text-align: left; display: grid; gap: 8px; margin: 12px 0; max-height: 360px; overflow-y: auto; }
  .rank-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fffaf5; border: 1.5px solid #efe0cf; border-radius: 12px; padding: 9px 12px;
    font-size: 14px; font-weight: 700;
  }

  .char-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: #fff6fa;
    border: 2px solid #f5d0e0;
    border-radius: 16px;
    padding: 7px 10px;
    margin-bottom: 12px;
  }
  .char-bar-label { font-size: 12.5px; font-weight: 800; color: #7a4258; white-space: nowrap; }
  .char-picks { display: flex; gap: 5px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
  .char-pick-btn {
    border: 2px solid #ecd5df;
    background: #ffffff;
    border-radius: 12px;
    padding: 4px 8px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .char-pick-btn.active { border-color: #ff7aa8; background: #ffe8f1; color: #b8295c; }

  .mascot-bubble {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mascot-svg { width: 52px; height: 52px; flex-shrink: 0; }
  .mascot-svg.bounce { animation: mbounce 0.45s ease; }
  @keyframes mbounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-8px) scale(1.08)} }

  .mode-btn.locked {
    opacity: 0.56;
    background: #f5f2ef;
    border-color: #e2dbd4;
  }
  .mode-btn.locked:hover { transform: none; border-color: #e2dbd4; background: #f5f2ef; }
  .unlock-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .teacher-unlock-btn {
    background: none;
    border: 1.5px dashed #d6c5b3;
    color: #8c7b6b;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    cursor: pointer;
  }

  /* ARCADE VS GAUGE */
  .vs-arena {
    background: linear-gradient(180deg, #241e2e, #362d47);
    border-radius: 18px;
    padding: 10px 12px;
    margin-bottom: 10px;
    color: #fff;
    border: 2.5px solid #ffd166;
  }
  .vs-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 900;
  }
  .vs-fighter { display: flex; align-items: center; gap: 5px; }
  .vs-fighter.active-fighter { color: #ffd166; text-shadow: 0 0 8px rgba(255,209,102,0.5); }
  .vs-badge {
    background: #ff4d6d;
    color: #fff;
    font-size: 11.5px;
    font-weight: 900;
    padding: 2px 9px;
    border-radius: 99px;
    letter-spacing: 1px;
  }
  .vs-gauge-track {
    height: 16px;
    background: #17131f;
    border-radius: 99px;
    overflow: hidden;
    display: flex;
    border: 2px solid #594e70;
  }
  .vs-bar-p1 {
    background: linear-gradient(90deg, #38bdf8, #3b82f6);
    height: 100%;
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .vs-bar-p2 {
    background: linear-gradient(90deg, #f43f5e, #fb7185);
    height: 100%;
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .wrong-box {
    text-align: left;
    background: #fff8f6;
    border: 2px solid #f5d3cc;
    border-radius: 16px;
    padding: 10px 12px;
    margin-top: 10px;
    font-size: 13px;
    max-height: 220px;
    overflow-y: auto;
  }
  .wrong-box h3 { font-size: 13.5px; color: #b83b2b; margin-bottom: 6px; }
  .wrong-item { padding: 4px 0; border-bottom: 1px dashed #eed8d3; line-height: 1.4; }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-summary { background: #fff1ec; border: 1.5px solid #f3c8bc; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; line-height: 1.55; }

  .hidden { display: none; }
  .trophy { font-size: 58px; margin: 8px 0; }
</style>
</head>
<body>
<div class="app">
  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="header-row">
      <span class="badge">🎹 고운음악학원 음악 놀이터</span>
      <button class="rank-open-btn" onclick="openRanking()">🏆 명예의 전당</button>
    </div>
    <h1>리듬 · 계이름 · 기호 게임!</h1>
    <p class="sub">내 이름을 고르고 재미있는 음악 놀이를 시작해 보세요 🎵</p>

    <div class="player-bar">
      <label for="student-select">도전자</label>
      <select id="student-select" class="player-select" onchange="onStudentChange()"></select>
    </div>

    <div class="char-bar">
      <span class="char-bar-label">내 캐릭터</span>
      <div class="char-picks" id="char-picks"></div>
    </div>

    <div class="section-label">🎮 놀이 메뉴 고르기</div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-rhythm" onclick="switchTab('rhythm')"><span class="tab-ico">🥁</span><span>리듬 놀이</span></button>
      <button class="tab-btn" id="tab-pitch" onclick="switchTab('pitch')"><span class="tab-ico">🎼</span><span>계이름 놀이</span></button>
      <button class="tab-btn" id="tab-symbol" onclick="switchTab('symbol')"><span class="tab-ico">🎵</span><span>기호·조표</span></button>
      <button class="tab-btn" id="tab-memory" onclick="switchTab('memory')"><span class="tab-ico">🃏</span><span>카드·대결</span></button>
    </div>
    <div class="section-label">📋 단계 선택</div>

    <!-- 1. 리듬 -->
    <div id="rhythm-modes" class="mode-grid">
      <button class="mode-btn" data-lock="rhythm:0" onclick="tryStartQuiz('rhythm', 'kind', 0)">
        <div class="mode-title">1단계 · 음표일까? 쉼표일까?</div>
        <div class="mode-desc">소리를 내는 '음표'와 쉬어가는 '쉼표'를 구별해요!</div>
      </button>
      <button class="mode-btn" data-lock="rhythm:1" onclick="tryStartQuiz('rhythm', 'name', 1)">
        <div class="mode-title">2단계 · 음표·쉼표 이름 맞히기</div>
        <div class="mode-desc">온음표, 2분음표, 4분음표, 8분음표와 쉼표 이름을 골라요!</div>
      </button>
      <button class="mode-btn" data-lock="rhythm:2" onclick="tryStartQuiz('rhythm', 'beat', 2)">
        <div class="mode-title">3단계 · 몇 박자일까요?</div>
        <div class="mode-desc">반 박(0.5박)부터 4박까지 박자 수를 맞혀요!</div>
      </button>
      <button class="mode-btn" data-lock="rhythm:3" onclick="tryStartQuiz('rhythm', 'mix', 3)">
        <div class="mode-title">⭐ 4단계 · 리듬 종합 왕중왕전</div>
        <div class="mode-desc">음표·쉼표 구별 + 이름 + 박자가 섞여서 나와요!</div>
      </button>
      <button class="mode-btn" onclick="openTapGame(1)">
        <div class="mode-title">🥁 리듬치기 1단계 · 4분·2분음표 기초 (10문제)</div>
        <div class="mode-desc">톡! 치는 4분음표와 2박 꾹~ 누르는 2분음표를 연습해요!</div>
      </button>
      <button class="mode-btn" onclick="openTapGame(2)">
        <div class="mode-title">🥁 리듬치기 2단계 · 점2분·온음표 길게 누르기 (10문제)</div>
        <div class="mode-desc">3박(점2분음표)과 4박(온음표)을 끝까지 쭈욱~ 눌러요!</div>
      </button>
      <button class="mode-btn" onclick="openTapGame(3)">
        <div class="mode-title">🥁 리듬치기 3단계 · 8분음표 리듬 종합 (10문제)</div>
        <div class="mode-desc">따다! 빠른 8분음표까지 섞인 종합 리듬에 도전해요!</div>
      </button>
    </div>

    <!-- 2. 계이름 -->
    <div id="pitch-modes" class="mode-grid hidden">
      <button class="mode-btn" data-lock="pitch:0" onclick="tryStartQuiz('pitch', 'three_c', 0)">
        <div class="mode-title">1단계 · 도 자리 세 개 찾기</div>
        <div class="mode-desc">낮은 도 · 가온 도 · 높은 도 위치를 정확히 구별해요!</div>
      </button>
      <button class="mode-btn" data-lock="pitch:1" onclick="tryStartQuiz('pitch', 'treble_mid', 1)">
        <div class="mode-title">2단계 · 높은음자리표 (가온 도 ~ 윗덧줄 전)</div>
        <div class="mode-desc">가온 도부터 오선 맨 위 솔까지 기본 계이름을 익혀요!</div>
      </button>
      <button class="mode-btn" data-lock="pitch:2" onclick="tryStartQuiz('pitch', 'treble_high', 2)">
        <div class="mode-title">3단계 · 높은음자리표 위덧줄 (높은 도 ~ 윗덧줄 3개)</div>
        <div class="mode-desc">높은 도부터 윗덧줄 3개(미)까지 높은 음을 읽어요!</div>
      </button>
      <button class="mode-btn" data-lock="pitch:3" onclick="tryStartQuiz('pitch', 'treble_low', 3)">
        <div class="mode-title">4단계 · 높은음자리표 아래덧줄 (가온 도 ~ 아래덧줄 2개)</div>
        <div class="mode-desc">가온 도에서 내려가는 시·라(아래덧줄 2개)까지 익혀요!</div>
      </button>
      <button class="mode-btn" data-lock="pitch:4" onclick="tryStartQuiz('pitch', 'bass_all', 4)">
        <div class="mode-title">5단계 · 낮은음자리표 (기본 + 위·아래덧줄)</div>
        <div class="mode-desc">낮은 도·가온 도부터 아래덧줄·위덧줄까지 왼손 악보를 읽어요!</div>
      </button>
      <button class="mode-btn" data-lock="pitch:5" onclick="tryStartQuiz('pitch', 'pitch_mix', 5)">
        <div class="mode-title">⭐ 6단계 · 계이름 종합 왕중왕전</div>
        <div class="mode-desc">높은음자리표 + 낮은음자리표 + 모든 덧줄이 다 나와요!</div>
      </button>
      <button class="mode-btn" onclick="openPianoMicGame()">
        <div class="mode-title">🎹 보너스 · 실제 피아노 건반 쳐서 맞히기!</div>
        <div class="mode-desc">마이크를 켜고 악보의 음을 피아노로 직접 띵~ 쳐 보세요!</div>
      </button>
    </div>

    <!-- 3. 기호 · 조표 -->
    <div id="symbol-modes" class="mode-grid hidden">

<script>
// ========================
// 1. 고운출석부 학생 이름 (이름만 안전 표시)
// ========================
const STUDENTS = [
  '은설','은채','혜성','소연','연서','예나','예린','유나','초은','하율',
  '하은','승윤','윤솔','지안','하임','혜미','나은','지성','윤결','동완',
  '은수','은재','정민','다엘','영채','진선','다솔','다솜'
];

function initStudentSelects() {
  const s1 = document.getElementById('student-select');
  const s2 = document.getElementById('p2-select');
  const saved = localStorage.getItem('goun_student') || STUDENTS[0];
  STUDENTS.forEach(name => {
    const o1 = document.createElement('option');
    o1.value = name; o1.textContent = name;
    if (name === saved) o1.selected = true;
    s1.appendChild(o1);

    const o2 = document.createElement('option');
    o2.value = name; o2.textContent = name;
    if (name === STUDENTS[1]) o2.selected = true;
    s2.appendChild(o2);
  });
  const customOpt = document.createElement('option');
  customOpt.value = '__custom__'; customOpt.textContent = '+ 직접 이름 입력';
  s1.appendChild(customOpt);
}

function getCurrentStudent() {
  const val = document.getElementById('student-select').value;
  if (val === '__custom__') return localStorage.getItem('goun_custom_student') || '친구';
  return val;
}
function onStudentChange() {
  const sel = document.getElementById('student-select');
  if (sel.value === '__custom__') {
    const name = prompt('학생 이름을 입력해 주세요 (예: 지우)');
    if (name && name.trim()) {
      localStorage.setItem('goun_custom_student', name.trim());
    }
  } else {
    localStorage.setItem('goun_student', sel.value);
  }
  applyLockUI();
}

// ========================
// 1-2. 응원 캐릭터 & 단계 잠금 해제 (80점 이상)
// ========================
const CHARS = [
  { id:'pia', emoji:'🐰', name:'피아', color:'#ffd6e7', ear:'<ellipse cx="22" cy="14" rx="5" ry="12" fill="#ffeaf2" stroke="#5c4740" stroke-width="2"/><ellipse cx="38" cy="14" rx="5" ry="12" fill="#ffeaf2" stroke="#5c4740" stroke-width="2"/>' },
  { id:'remi', emoji:'🐻', name:'레미', color:'#f5d9b8', ear:'<circle cx="17" cy="18" r="6" fill="#d9a973" stroke="#5c4740" stroke-width="2"/><circle cx="43" cy="18" r="6" fill="#d9a973" stroke="#5c4740" stroke-width="2"/>' },
  { id:'coco', emoji:'🐱', name:'코코', color:'#fff2c6', ear:'<polygon points="15,24 19,10 27,20" fill="#ffe699" stroke="#5c4740" stroke-width="2"/><polygon points="45,24 41,10 33,20" fill="#ffe699" stroke="#5c4740" stroke-width="2"/>' },
  { id:'rhythm', emoji:'🐶', name:'리듬', color:'#e0efff', ear:'<ellipse cx="14" cy="30" rx="5" ry="10" fill="#a8c7eb" stroke="#5c4740" stroke-width="2"/><ellipse cx="46" cy="30" rx="5" ry="10" fill="#a8c7eb" stroke="#5c4740" stroke-width="2"/>' }
];
let currentCharId = localStorage.getItem('goun_char') || 'pia';
let teacherUnlockedAll = localStorage.getItem('goun_teacher_unlock') === '1';

function initCharPicks() {
  const wrap = document.getElementById('char-picks');
  wrap.innerHTML = '';
  CHARS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'char-pick-btn' + (c.id === currentCharId ? ' active' : '');
    b.textContent = `${c.emoji} ${c.name}`;
    b.onclick = () => {
      currentCharId = c.id;
      localStorage.setItem('goun_char', c.id);
      initCharPicks();
    };
    wrap.appendChild(b);
  });
}

function mascotSvg(charId, mood='idle') {
  const c = CHARS.find(x => x.id === charId) || CHARS[0];
  const eyes = mood === 'happy'
    ? '<path d="M21 31 Q24 27 27 31" fill="none" stroke="#3c2f2a" stroke-width="2.4" stroke-linecap="round"/><path d="M33 31 Q36 27 39 31" fill="none" stroke="#3c2f2a" stroke-width="2.4" stroke-linecap="round"/>'
    : mood === 'cheer'
    ? '<circle cx="24" cy="31" r="2.5" fill="#3c2f2a"/><circle cx="36" cy="31" r="2.5" fill="#3c2f2a"/><path d="M26 39 Q30 37 34 39" fill="none" stroke="#3c2f2a" stroke-width="2" stroke-linecap="round"/>'
    : '<circle cx="24" cy="31" r="2.5" fill="#3c2f2a"/><circle cx="36" cy="31" r="2.5" fill="#3c2f2a"/>';
  const mouth = mood === 'happy'
    ? '<path d="M26 36 Q30 42 34 36" fill="#ff7aa8" stroke="#3c2f2a" stroke-width="2"/>'
    : mood === 'cheer' ? ''
    : '<path d="M27 37 Q30 40 33 37" fill="none" stroke="#3c2f2a" stroke-width="2" stroke-linecap="round"/>';
  const star = mood === 'happy' ? '<text x="45" y="16" font-size="14">✨</text>' : '';
  return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${c.ear}<circle cx="30" cy="33" r="17" fill="${c.color}" stroke="#5c4740" stroke-width="2.2"/>${eyes}${mouth}<circle cx="20" cy="35" r="2.5" fill="#ff9eb8" opacity="0.6"/><circle cx="40" cy="35" r="2.5" fill="#ff9eb8" opacity="0.6"/>${star}</svg>`;
}

function getStudentUnlocks(student) {
  const all = JSON.parse(localStorage.getItem('goun_unlocks') || '{}');
  return all[student] || { rhythm: 0, pitch: 0, symbol: 0 };
}
function unlockNextStage(student, gameType, stageIdx) {
  const all = JSON.parse(localStorage.getItem('goun_unlocks') || '{}');
  if (!all[student]) all[student] = { rhythm: 0, pitch: 0, symbol: 0 };
  if (stageIdx + 1 > (all[student][gameType] || 0)) {
    all[student][gameType] = stageIdx + 1;
    localStorage.setItem('goun_unlocks', JSON.stringify(all));
  }
}
function applyLockUI() {
  const student = getCurrentStudent();
  const unlocks = getStudentUnlocks(student);
  document.querySelectorAll('[data-lock]').forEach(btn => {
    const [gType, idxStr] = btn.dataset.lock.split(':');
    const idx = Number(idxStr);
    const unlocked = teacherUnlockedAll || idx <= (unlocks[gType] || 0);
    btn.classList.toggle('locked', !unlocked);
    const titleEl = btn.querySelector('.mode-title');
    if (titleEl) {
      const clean = titleEl.textContent.replace(/^🔒\s*/, '');
      titleEl.textContent = unlocked ? clean : '🔒 ' + clean;
    }
  });
  const tb = document.getElementById('teacher-unlock-btn');
  if (tb) tb.textContent = teacherUnlockedAll ? '🔒 학생별 잠금 모드로 돌아가기' : '🔓 선생님 전체 잠금 해제';
}
function toggleTeacherUnlock() {
  teacherUnlockedAll = !teacherUnlockedAll;
  localStorage.setItem('goun_teacher_unlock', teacherUnlockedAll ? '1' : '0');
  applyLockUI();
}
function tryStartQuiz(gameType, mode, stageIdx) {
  const unlocks = getStudentUnlocks(getCurrentStudent());
  if (!teacherUnlockedAll && stageIdx > (unlocks[gameType] || 0)) {
    alert(`이전 단계에서 80점 이상 받으면 ${stageIdx + 1}단계 자물쇠가 풀려요! 🔓`);
    return;
  }
  currentStageIdx = stageIdx;
  startQuiz(gameType, mode);
}

function saveStudentScore(name, pts) {
  if (!name || pts <= 0) return;
  const data = JSON.parse(localStorage.getItem('goun_records') || '{}');
  if (!data[name]) data[name] = { total: 0, best: 0, plays: 0 };
  data[name].total += pts;
  data[name].plays += 1;
  if (pts > data[name].best) data[name].best = pts;
  localStorage.setItem('goun_records', JSON.stringify(data));
}

// ========================
// 2. 리듬 SVG & 데이터
// ========================
function rhythmStaffSvg(inner) {

    `<line x1="25" y1="${y}" x2="255" y2="${y}" stroke="#c9bfb4" stroke-width="2"/>`
  ).join('');
  return `<svg width="260" height="150" viewBox="0 0 280 155" xmlns="http://www.w3.org/2000/svg">${lines}${inner}</svg>`;
}

function pitchStaffSvg(clef, pos) {
  const lines = [64, 78, 92, 106, 120].map(y =>
    `<line x1="25" y1="${y}" x2="255" y2="${y}" stroke="#bfb4a8" stroke-width="2"/>`
  ).join('');
  let clefSvg = clef === 'treble'
    ? `<g transform="translate(36, 48) scale(0.95)"><path d="M22 86 C12 86, 8 78, 13 72 C17 67, 24 71, 22 77 C20 82, 13 82, 13 75 M22 86 C32 86, 36 74, 30 62 C25 53, 14 54, 12 63 C10 71, 18 77, 26 73 C33 69, 34 57, 25 48 C18 41, 16 26, 23 12 C27 4, 31 8, 29 18 L19 95 C18 103, 11 105, 8 100" fill="none" stroke="#3c342e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>`
    : `<g transform="translate(38, 64)"><circle cx="12" cy="14" r="5" fill="#3c342e"/><path d="M10 14 C12 2, 32 0, 34 16 C35 30, 22 44, 8 52" fill="none" stroke="#3c342e" stroke-width="4" stroke-linecap="round"/><circle cx="43" cy="8" r="3.2" fill="#3c342e"/><circle cx="43" cy="22" r="3.2" fill="#3c342e"/></g>`;

  const noteX = 165, noteY = 120 - pos * 7;
  let ledgers = '';
  if (pos >= 10) for (let p = 10; p <= pos; p += 2) ledgers += `<line x1="${noteX-20}" y1="${120-p*7}" x2="${noteX+20}" y2="${120-p*7}" stroke="#5a5048" stroke-width="2.2"/>`;
  if (pos <= -2) for (let p = -2; p >= pos; p -= 2) ledgers += `<line x1="${noteX-20}" y1="${120-p*7}" x2="${noteX+20}" y2="${120-p*7}" stroke="#5a5048" stroke-width="2.2"/>`;
  const stem = pos < 4
    ? `<line x1="${noteX+10}" y1="${noteY-2}" x2="${noteX+10}" y2="${noteY-40}" stroke="#2d2926" stroke-width="3.2" stroke-linecap="round"/>`
    : `<line x1="${noteX-10}" y1="${noteY+2}" x2="${noteX-10}" y2="${noteY+40}" stroke="#2d2926" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg width="260" height="165" viewBox="0 0 280 175" xmlns="http://www.w3.org/2000/svg">${lines}${clefSvg}${ledgers}<ellipse cx="${noteX}" cy="${noteY}" rx="11" ry="8" fill="#2d2926" transform="rotate(-18 ${noteX} ${noteY})"/>${stem}</svg>`;
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, startTime, duration, type='triangle', vol=0.25) {
  const ctx = getCtx();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime + duration);
}
function sfxCorrect() {
  const c = getCtx(), n = c.currentTime;
  playTone(523.25, n, 0.14); playTone(659.25, n+0.1, 0.14); playTone(783.99, n+0.2, 0.28);
}
function sfxWrong() {
  const c = getCtx(), n = c.currentTime;
  playTone(260, n, 0.18, 'sine', 0.2); playTone(220, n+0.15, 0.25, 'sine', 0.2);
}
function playCurrentSound() {
  const q = questions[qIndex], c = getCtx(), n = c.currentTime;
  if (currentGameType === 'rhythm') {
    const b = 0.55;
    if (q.item.kind === '음표') playTone(523.25, n, q.item.beatsNum * b);
    else for (let i = 0; i < Math.max(1, Math.ceil(q.item.beatsNum)); i++) playTone(880, n+i*b, 0.06, 'sine', 0.12);
  } else if (currentGameType === 'pitch') {
    playTone(q.item.hz, n, 0.75);
  }
}

    .forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
}
function goHome() {
  if (tapTimer) { clearInterval(tapTimer); tapTimer = null; }
  stopPianoMic();
  showOnly('home-screen');
}
function switchTab(tab) {
  currentTab = tab;
  ['rhythm','pitch','symbol','memory'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById(t + '-modes').classList.toggle('hidden', t !== tab);
  });
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function scatterMemoryCards(pairs) {
  for (let attempt = 0; attempt < 80; attempt++) {
    const arr = shuffle(pairs);
    let hasAdj = false;
    for (let i = 0; i < arr.length; i++) {
      const c = i % 3;
      if (c < 2 && i + 1 < arr.length && arr[i].key === arr[i + 1].key) { hasAdj = true; break; }
      if (i + 3 < arr.length && arr[i].key === arr[i + 3].key) { hasAdj = true; break; }
    }
    if (!hasAdj) return arr;
  }
  return shuffle(pairs);
}

const SOLFEGE_ALL = ['도','레','미','파','솔','라','시'];
const ALL_RHYTHM_NAMES = RHYTHM_ITEMS.map(i => i.name);
const ALL_BEATS = ['4박자','3박자','2박자','1박자','반 박(0.5박)'];

let roundWrongs = [];
const STAGE_LABELS = {
  rhythm: ['리듬 1단계(음표·쉼표)','리듬 2단계(이름)','리듬 3단계(박자)','리듬 4단계(종합)'],
  pitch: ['계이름 1단계(도 자리)','계이름 2단계(높은음 기본)','계이름 3단계(위덧줄)','계이름 4단계(아래덧줄)','계이름 5단계(낮은음)','계이름 6단계(종합)'],
  symbol: ['기호 1단계(연주·반복)','기호 2단계(셈여림)','기호 3단계(조성 ♯·♭)','기호 4단계(종합)']
};
function getStageLabel() {
  return (STAGE_LABELS[currentGameType] && STAGE_LABELS[currentGameType][currentStageIdx]) || currentGameType;
}
function recordWrong(student, stageLabel, itemLabel, hint) {
  const all = JSON.parse(localStorage.getItem('goun_wrongs') || '{}');
  if (!all[student]) all[student] = {};
  if (!all[student][stageLabel]) all[student][stageLabel] = {};
  if (!all[student][stageLabel][itemLabel]) all[student][stageLabel][itemLabel] = { count: 0, hint };
  all[student][stageLabel][itemLabel].count += 1;
  localStorage.setItem('goun_wrongs', JSON.stringify(all));
}

function startQuiz(gameType, mode) {
  currentGameType = gameType;
  currentMode = mode;
  questions = [];

  if (gameType === 'rhythm') {
    for (let i = 0; i < 10; i++) {
      const item = RHYTHM_ITEMS[Math.floor(Math.random() * RHYTHM_ITEMS.length)];
      const t = mode === 'mix' ? ['kind','name','beat'][i % 3] : mode;
      if (t === 'kind') questions.push({ item, prompt:'이 친구는 음표일까요, 쉼표일까요?', correct:item.kind, options:['음표 🎵','쉼표 🤫'], colClass:'' });
      else if (t === 'name') questions.push({ item, prompt:'이 기호의 이름은 무엇일까요?', correct:item.name, options:shuffle([item.name, ...shuffle(ALL_RHYTHM_NAMES.filter(n=>n!==item.name)).slice(0,3)]), colClass:'' });
      else questions.push({ item, prompt:'이 기호는 몇 박자일까요?', correct:item.beat, options:shuffle([item.beat, ...shuffle(ALL_BEATS.filter(b=>b!==item.beat)).slice(0,3)]), colClass:'' });
    }
  } else if (gameType === 'pitch') {
    let pool = mode === 'three_c' ? THREE_C_ITEMS
      : mode === 'treble_mid' ? TREBLE_MID
      : mode === 'treble_high' ? TREBLE_HIGH
      : mode === 'treble_low' ? TREBLE_LOW
      : mode === 'bass_all' ? BASS_ALL
      : [...TREBLE_MID, ...TREBLE_HIGH, ...TREBLE_LOW, ...BASS_ALL];
    for (let i = 0; i < 10; i++) {
      const item = pool[Math.floor(Math.random() * pool.length)];
      if (mode === 'three_c') questions.push({ item, prompt:'어느 자리의 "도"일까요?', correct:item.cLabel, options:['낮은 도','가온 도','높은 도'], colClass:'three-col' });
      else questions.push({ item, prompt:'이 음표의 계이름은 무엇일까요?', correct:item.solfege, options:SOLFEGE_ALL, colClass:'four-col' });
    }
  } else if (gameType === 'symbol') {
    let pool = mode === 'art' ? ART_SYMBOLS : mode === 'dyn' ? DYN_SYMBOLS : mode === 'key' ? KEY_SIGS : [...ART_SYMBOLS, ...DYN_SYMBOLS, ...KEY_SIGS];
    for (let i = 0; i < 10; i++) {
      const item = pool[Math.floor(Math.random() * pool.length)];
      const samePool = ART_SYMBOLS.includes(item) ? ART_SYMBOLS : DYN_SYMBOLS.includes(item) ? DYN_SYMBOLS : KEY_SIGS;
      const others = shuffle(samePool.filter(x => x.name !== item.name)).slice(0, 3).map(x => x.name);
      questions.push({
        item,
        prompt: samePool === KEY_SIGS ? '이 조표는 무슨 장조일까요?' : '이 음악 기호의 뜻은 무엇일까요?',
        correct: item.name,
        options: shuffle([item.name, ...others]),
        colClass: ''
      });
    }
  }


  qIndex = 0; score = 0; roundWrongs = [];
  showOnly('game-screen');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[qIndex];
  document.getElementById('progress-pill').textContent = `${qIndex + 1} / ${questions.length}`;
  document.getElementById('score-pill').textContent = `⭐ ${score}점`;
  document.getElementById('quiz-mascot').innerHTML = mascotSvg(currentCharId, 'idle');
  document.getElementById('quiz-mascot').classList.remove('bounce');
  document.getElementById('q-prompt').textContent = q.prompt;
  document.getElementById('svg-wrap').innerHTML = q.item.svg;
  const sb = document.getElementById('sound-btn');
  sb.classList.toggle('hidden', currentGameType === 'symbol');
  sb.textContent = currentGameType === 'rhythm' ? '🔊 박자 소리 들어보기' : '🎹 피아노 음 높이 들어보기';
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  const choicesEl = document.getElementById('choices');
  choicesEl.className = 'choices ' + (q.colClass || '');
  choicesEl.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(btn, opt) {
  if (answered) return;
  answered = true;
  const q = questions[qIndex];
  const cleanOpt = opt.replace(' 🎵','').replace(' 🤫','');
  const isRight = cleanOpt === q.correct;

  document.querySelectorAll('#choices .choice-btn').forEach(b => {
    b.disabled = true;
    const cleanB = b.textContent.replace(' 🎵','').replace(' 🤫','');
    if (cleanB === q.correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden', 'fb-ok', 'fb-no');
  if (isRight) {
    score += 10;
    document.getElementById('score-pill').textContent = `⭐ ${score}점`;
    btn.classList.add('correct');
    fb.classList.add('fb-ok');
    fb.textContent = `정답! 🎉 ${q.item.name || q.item.cLabel || q.item.solfege}`;
    document.getElementById('quiz-mascot').innerHTML = mascotSvg(currentCharId, 'happy');
    document.getElementById('quiz-mascot').classList.add('bounce');
    sfxCorrect();
  } else {
    btn.classList.add('wrong');
    fb.classList.add('fb-no');
    fb.textContent = `아쉬워요! ${q.item.hint}`;
    document.getElementById('quiz-mascot').innerHTML = mascotSvg(currentCharId, 'cheer');
    const itemLabel = q.item.name || q.item.cLabel || (q.item.clef ? `${q.item.clef==='treble'?'높은음':'낮은음'} ${q.item.solfege}` : q.correct);
    roundWrongs.push({ label: itemLabel, hint: q.item.hint });
    recordWrong(getCurrentStudent(), getStageLabel(), itemLabel, q.item.hint);
    sfxWrong();
  }
  if (currentGameType === 'pitch') setTimeout(() => playCurrentSound(), 180);
  const nb = document.getElementById('next-btn');
  nb.textContent = qIndex === questions.length - 1 ? '결과 보기 🏆' : '다음 문제 →';
  nb.classList.remove('hidden');
}

function nextQuestion() {
  if (qIndex < questions.length - 1) { qIndex++; renderQuestion(); }
  else showQuizResult();
}

function showQuizResult() {
  const student = getCurrentStudent();
  saveStudentScore(student, score);
  let unlockMsg = '';
  if (score >= 80) {
    unlockNextStage(student, currentGameType, currentStageIdx);
    applyLockUI();
    unlockMsg = ' 🔓 다음 단계 잠금이 풀렸어요!';
  } else {
    unlockMsg = ' (80점 이상 받으면 다음 단계가 열려요!)';
  }
  showOnly('result-screen');
  document.getElementById('trophy-icon').textContent = score >= 80 ? '🏆' : score >= 50 ? '🌟' : '🌱';
  document.getElementById('result-title').textContent = `${student} ${score >= 80 ? '클리어!' : '수고했어요!'}`;
  document.getElementById('result-desc').textContent = `10문제 중 ${score / 10}문제를 맞혀서 ${score}점을 기록했어요!${unlockMsg}`;
  const rw = document.getElementById('result-wrongs');
  if (roundWrongs.length > 0) {
    rw.classList.remove('hidden');
    rw.innerHTML = `<h3>📝 이번 판 틀린 문제 (${roundWrongs.length}개)</h3>` +
      roundWrongs.map(w => `<div class="wrong-item">• <strong>${w.label}</strong>: ${w.hint}</div>`).join('');
  } else {
    rw.classList.add('hidden');
  }
}

function retryLast() {
  if (currentGameType === 'memory') startMemory(memTheme, memPlayerCount);
  else startQuiz(currentGameType, currentMode);
}

let memTheme = 'rhythm_name', memPlayerCount = 1;
let memCards = [], memFlipped = [], memLocked = false;
let memTurn = 0, memScores = [0, 0], memMoves = 0, memMatched = 0;
let memNames = ['', ''];

function startMemory(theme, players) {
  currentGameType = 'memory';
  memTheme = theme; memPlayerCount = players;
  memNames = [getCurrentStudent(), document.getElementById('p2-select').value];
  if (players === 2 && memNames[0] === memNames[1]) memNames[1] = memNames[1] + '2';

  let pairs = [];
  if (theme === 'rhythm_name') {
    const pick = shuffle(RHYTHM_ITEMS).slice(0, 6);
    pick.forEach(it => {
      pairs.push({ key: it.id, type:'svg', html: it.svg });
      pairs.push({ key: it.id, type:'txt', html: it.name });
    });
  } else if (theme === 'rhythm_beat') {
    const pick = shuffle(RHYTHM_ITEMS.filter(x => x.kind === '음표' || x.id === 'quarter_rest' || x.id === 'half_rest')).slice(0, 6);
    // 박자 중복 방지를 위해 고유 박자 5개 + 1개
    const uniq = [];
    const seenBeat = new Set();
    for (const it of shuffle(RHYTHM_ITEMS)) {
      if (!seenBeat.has(it.beat)) { seenBeat.add(it.beat); uniq.push(it); }
      if (uniq.length === 5) break;
    }
    uniq.forEach(it => {
      pairs.push({ key: it.beat, type:'svg', html: it.svg });
      pairs.push({ key: it.beat, type:'txt', html: it.beat });
    });
  } else {
    const pick = shuffle([...ART_SYMBOLS, ...DYN_SYMBOLS]).slice(0, 6);
    pick.forEach(it => {
      pairs.push({ key: it.id, type:'svg', html: it.svg });
      pairs.push({ key: it.id, type:'txt', html: it.short });
    });
  }

  memCards = scatterMemoryCards(pairs).map((c, idx) => ({ ...c, idx, open:false, done:false }));
  memFlipped = []; memLocked = false; memTurn = 0; memScores = [0, 0]; memMoves = 0; memMatched = 0;
  showOnly('memory-screen');
  renderMemory();
}

function renderMemory() {
  const totalPairs = memCards.length / 2;
  document.getElementById('mem-moves-pill').textContent = `시도 ${memMoves}회`;
  document.getElementById('mem-left-pill').textContent = `남은 짝 ${totalPairs - memMatched}개`;

  const pDiv = document.getElementById('mem-players');
  if (memPlayerCount === 1) {
    const ch = CHARS.find(x => x.id === currentCharId) || CHARS[0];
    pDiv.innerHTML = `<div class="mem-pbox active-turn">${ch.emoji} ${memNames[0]} 혼자 도전 중 (${memMatched}/${totalPairs}쌍)</div>`;
  } else {
    const c1 = CHARS.find(x => x.id === currentCharId) || CHARS[0];
    const c2 = CHARS.find(x => x.id !== currentCharId) || CHARS[1];
    const diff = memScores[0] - memScores[1];
    const p1Pct = Math.max(12, Math.min(88, 50 + diff * 10));
    const p2Pct = 100 - p1Pct;
    pDiv.innerHTML = `
      <div class="vs-arena" style="width:100%;">
        <div class="vs-top">
          <div class="vs-fighter ${memTurn===0?'active-fighter':''}">${c1.emoji} 1P ${memNames[0]} (${memScores[0]}쌍)</div>
          <div class="vs-badge">VS</div>
          <div class="vs-fighter ${memTurn===1?'active-fighter':''}">(${memScores[1]}쌍) ${memNames[1]} 2P ${c2.emoji}</div>
        </div>
        <div class="vs-gauge-track">
          <div class="vs-bar-p1" style="width:${p1Pct}%;"></div>
          <div class="vs-bar-p2" style="width:${p2Pct}%;"></div>
        </div>
      </div>
    `;
  }

  const grid = document.getElementById('mem-grid');
  grid.innerHTML = '';
  memCards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'mem-card' + (c.open ? ' flipped' : '') + (c.done ? ' matched' : '');
    el.innerHTML = (c.open || c.done) ? c.html : '🎵';
    el.onclick = () => flipMemCard(i);
    grid.appendChild(el);
  });
}

function flipMemCard(i) {
  if (memLocked) return;
  const card = memCards[i];
  if (card.open || card.done) return;

  card.open = true;
  memFlipped.push(i);
  renderMemory();

  if (memFlipped.length === 2) {
    memLocked = true;
    memMoves++;
    const [a, b] = memFlipped.map(idx => memCards[idx]);
    const fb = document.getElementById('mem-feedback');
    fb.classList.remove('hidden', 'fb-ok', 'fb-no');

    if (a.key === b.key) {
      a.done = true; b.done = true;
      memMatched++;
      memScores[memTurn]++;
      sfxCorrect();
      fb.classList.add('fb-ok');
      fb.textContent = memPlayerCount === 2 ? `정답! ${memNames[memTurn]} 님 한 번 더! 🎉` : `짝 맞았어요! 🎉`;
      memFlipped = [];
      memLocked = false;
      renderMemory();

      if (memMatched === memCards.length / 2) {
        setTimeout(() => {
          if (memPlayerCount === 1) {
            const pts = Math.max(40, 120 - memMoves * 5);
            saveStudentScore(memNames[0], pts);
            showOnly('result-screen');
            document.getElementById('trophy-icon').textContent = '🃏';
            document.getElementById('result-title').textContent = `${memNames[0]} 클리어!`;
            document.getElementById('result-desc').textContent = `${memMoves}번 만에 모든 짝을 찾아 ${pts}점을 얻었어요!`;
          } else {
            saveStudentScore(memNames[0], memScores[0] * 15);
            saveStudentScore(memNames[1], memScores[1] * 15);
            showOnly('result-screen');
            document.getElementById('trophy-icon').textContent = '🏆';
            const win = memScores[0] === memScores[1] ? '무승부!' : (memScores[0] > memScores[1] ? `${memNames[0]} 승리!` : `${memNames[1]} 승리!`);
            document.getElementById('result-title').textContent = win;
            document.getElementById('result-desc').textContent = `${memNames[0]} ${memScores[0]}쌍 vs ${memNames[1]} ${memScores[1]}쌍`;
          }
        }, 650);
      }
    } else {
      sfxWrong();
      fb.classList.add('fb-no');
      fb.textContent = memPlayerCount === 2 ? `아쉬워요! 다음 친구 차례 👉` : `다른 짝이에요! 다시 기억해 봐요`;
      setTimeout(() => {
        a.open = false; b.open = false;
        memFlipped = [];
        if (memPlayerCount === 2) memTurn = 1 - memTurn;
        memLocked = false;
        renderMemory();
      }, 950);
    }
  }
}

function tapPatternSvg(notes) {
  const lines = [48, 64, 80, 96, 112].map(y =>
    `<line x1="20" y1="${y}" x2="260" y2="${y}" stroke="#c9bfb4" stroke-width="2"/>`
  ).join('');
  let inner = '';
  notes.forEach(n => {
    const x = 44 + n.start * 52;
    const y = 88;
    if (n.type === 'w') {
      inner += `<ellipse cx="${x + 15}" cy="${y}" rx="13" ry="9" fill="#fffcf7" stroke="#2d2926" stroke-width="4" transform="rotate(-15 ${x+15} ${y})"/>`;
    } else if (n.type === 'dh') {
      inner += `<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#fffcf7" stroke="#2d2926" stroke-width="3.8" transform="rotate(-20 ${x} ${y})"/><line x1="${x+10}" y1="${y-2}" x2="${x+10}" y2="${y-44}" stroke="#2d2926" stroke-width="3.6" stroke-linecap="round"/><circle cx="${x+21}" cy="${y}" r="3.8" fill="#2d2926"/>`;
    } else if (n.type === 'h') {
      inner += `<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#fffcf7" stroke="#2d2926" stroke-width="3.8" transform="rotate(-20 ${x} ${y})"/><line x1="${x+10}" y1="${y-2}" x2="${x+10}" y2="${y-44}" stroke="#2d2926" stroke-width="3.6" stroke-linecap="round"/>`;
    } else if (n.type === 'q') {
      inner += `<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#2d2926" transform="rotate(-20 ${x} ${y})"/><line x1="${x+10}" y1="${y-2}" x2="${x+10}" y2="${y-44}" stroke="#2d2926" stroke-width="3.6" stroke-linecap="round"/>`;
    } else if (n.type === 'e2') {
      const x2 = x + 26;
      inner += `<ellipse cx="${x}" cy="${y}" rx="9.5" ry="7" fill="#2d2926" transform="rotate(-20 ${x} ${y})"/><line x1="${x+8.5}" y1="${y-2}" x2="${x+8.5}" y2="${y-42}" stroke="#2d2926" stroke-width="3.2"/>`
            + `<ellipse cx="${x2}" cy="${y}" rx="9.5" ry="7" fill="#2d2926" transform="rotate(-20 ${x2} ${y})"/><line x1="${x2+8.5}" y1="${y-2}" x2="${x2+8.5}" y2="${y-42}" stroke="#2d2926" stroke-width="3.2"/>`
            + `<line x1="${x+8.5}" y1="${y-42}" x2="${x2+8.5}" y2="${y-42}" stroke="#2d2926" stroke-width="5.5"/>`;
    }
  });
  return `<svg width="260" height="145" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">${lines}${inner}</svg>`;
}

};
let tapStage = 1, tapIdx = 0, tapCombo = 0, tapScore = 0, tapTimer = null, tapStartMs = 0, tapExpected = [], tapHits = [];
let activeHold = null;

function openTapGame(stage = 1) {
  currentGameType = 'tap';
  tapStage = stage;
  tapIdx = 0; tapCombo = 0; tapScore = 0;
  showOnly('tap-screen');
  renderTapPattern();
}
function renderTapPattern() {
  const list = TAP_STAGE_PATTERNS[tapStage] || TAP_STAGE_PATTERNS[1];
  const p = list[tapIdx];
  const expected = [];
  p.notes.forEach(n => {
    if (n.type === 'e2') {
      expected.push({ start: n.start, dur: 0.5 });
      expected.push({ start: n.start + 0.5, dur: 0.5 });
    } else {
      expected.push({ start: n.start, dur: n.dur });
    }
  });
  tapExpected = expected;
  document.getElementById('tap-progress-pill').textContent = `${tapStage}단계 · ${tapIdx + 1} / ${list.length} 패턴`;
  document.getElementById('tap-score-pill').textContent = `콤보 ${tapCombo}`;
  document.getElementById('tap-prompt').textContent = p.label;
  document.getElementById('tap-svg').innerHTML = tapPatternSvg(p.notes);
  document.getElementById('tap-feedback').classList.add('hidden');
}
function startTapRound() {
  if (tapTimer) clearInterval(tapTimer);
  const c = getCtx(), beatMs = 620;
  const dots = document.querySelectorAll('#beat-dots .beat-dot');
  let step = 0;
  tapHits = [];
  tapStartMs = performance.now() + 4 * beatMs;

  const fb = document.getElementById('tap-feedback');
  fb.classList.remove('hidden', 'fb-ok', 'fb-no');
  fb.textContent = '예비박 하나, 둘, 셋, 넷 듣고 시작!';

  function tick() {
    dots.forEach((d, idx) => d.classList.toggle('lit', idx === (step % 4)));
    playTone(step < 4 ? 880 : 660, c.currentTime, 0.07, 'sine', 0.16);
    if (step === 4) fb.textContent = '지금! 박자 길이만큼 톡 또는 꾹~ 눌러 보세요 🥁';
    if (step === 8) {
      clearInterval(tapTimer); tapTimer = null;
      dots.forEach(d => d.classList.remove('lit'));
      if (activeHold) onTapUp();
      gradeTapRound();
    }
    step++;
  }
  tick();
  tapTimer = setInterval(tick, beatMs);
}
function onTapDown(e) {
  if (e) e.preventDefault();
  if (activeHold) return;
  const pad = document.getElementById('tap-pad');
  pad.classList.add('holding');
  const c = getCtx();
  const osc = c.createOscillator(), gain = c.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(523.25, c.currentTime);
  gain.gain.setValueAtTime(0.26, c.currentTime);
  osc.connect(gain); gain.connect(c.destination);
  osc.start();
  const startBeat = tapStartMs > 0 ? (performance.now() - tapStartMs) / 620 : 0;
  activeHold = { osc, gain, startMs: performance.now(), startBeat };
}
function onTapUp(e) {
  if (e) e.preventDefault();
  const pad = document.getElementById('tap-pad');
  pad.classList.remove('holding');
  if (!activeHold) return;
  const c = getCtx();
  const durBeats = (performance.now() - activeHold.startMs) / 620;
  try {
    activeHold.gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.06);
    activeHold.osc.stop(c.currentTime + 0.07);
  } catch (_) {}
  if (tapStartMs > 0) tapHits.push({ start: activeHold.startBeat, dur: durBeats });
  activeHold = null;
}
function gradeTapRound() {
  const fb = document.getElementById('tap-feedback');
  fb.classList.remove('hidden', 'fb-ok', 'fb-no');
  let ok = tapHits.length === tapExpected.length;
  let shortMsg = '';
  if (ok) {
    for (let i = 0; i < tapExpected.length; i++) {
      if (Math.abs(tapHits[i].start - tapExpected[i].start) > 0.48) { ok = false; break; }
      if (tapExpected[i].dur >= 2 && tapHits[i].dur < tapExpected[i].dur - 0.7) {
        ok = false;
        shortMsg = `${tapExpected[i].dur}박 음표는 ${tapExpected[i].dur}박 동안 꾹~ 누르고 계셔야 해요!`;
        break;
      }
    }
  }
  if (ok) {
    tapCombo++;
    tapScore = (typeof tapScore === 'number' ? tapScore : 0) + 15;
    sfxCorrect();
    saveStudentScore(getCurrentStudent(), 15);
    fb.classList.add('fb-ok');
    tapIdx++;
    const list = TAP_STAGE_PATTERNS[tapStage] || TAP_STAGE_PATTERNS[1];
    if (tapIdx >= list.length) {
      fb.textContent = `${tapStage}단계 ${list.length}문제 전부 클리어!! 🎉`;
      setTimeout(() => {
        showOnly('result-screen');
        document.getElementById('trophy-icon').textContent = '🥁';
        document.getElementById('result-title').textContent = `${getCurrentStudent()} 리듬 ${tapStage}단계 마스터!`;
        document.getElementById('result-desc').textContent = `박자 두드리기 ${tapStage}단계 ${list.length}문제를 전부 성공해 총 ${tapScore}점을 얻었어요!`;
        document.getElementById('result-wrongs').classList.add('hidden');
      }, 1100);
    } else {
      fb.textContent = `완벽한 박자 & 길이! 🎉 (+15점) 다음 패턴으로 넘어가요!`;
      setTimeout(renderTapPattern, 1200);
    }
  } else {
    tapCombo = 0;
    sfxWrong();
    fb.classList.add('fb-no');
    fb.textContent = shortMsg || `박자가 조금 어긋났어요! (${tapHits.length}번 침 / 정답 ${tapExpected.length}번) 다시 도전!`;
  }
  document.getElementById('tap-score-pill').textContent = `콤보 ${tapCombo}`;
}

// 8-2. 실제 피아노 건반 쳐서 맞히기 (마이크 음정 인식)
// ========================
let micQuestions = [], micIdx = 0, micScore = 0;
let micStream = null, micAnalyser = null, micRaf = null, micLocked = false;
const NOTE_NAMES_KR = ['도','도♯','레','레♯','미','파','파♯','솔','솔♯','라','라♯','시'];

function openPianoMicGame() {
  currentGameType = 'mic';
  const pool = [...THREE_C_ITEMS, ...TREBLE_MID];
  micQuestions = [];
  for (let i = 0; i < 8; i++) micQuestions.push(pool[Math.floor(Math.random() * pool.length)]);
  micIdx = 0; micScore = 0; micLocked = false;
  showOnly('piano-mic-screen');
  renderMicQuestion();
}
function renderMicQuestion() {
  micLocked = false;
  const q = micQuestions[micIdx];
  document.getElementById('mic-progress-pill').textContent = `${micIdx + 1} / ${micQuestions.length}`;
  document.getElementById('mic-score-pill').textContent = `⭐ ${micScore}점`;
  document.getElementById('mic-svg').innerHTML = q.svg;
  document.getElementById('mic-feedback').classList.add('hidden');
  document.getElementById('mic-heard').textContent = micStream ? '🎤 피아노 건반을 쳐 보세요!' : '🎤 아래 마이크 버튼을 눌러 시작하세요!';
}
async function togglePianoMic() {
  if (micStream) { stopPianoMic(); return; }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ctx = getCtx();
    if (ctx.state === 'suspended') await ctx.resume();
    const src = ctx.createMediaStreamSource(micStream);
    micAnalyser = ctx.createAnalyser();
    micAnalyser.fftSize = 2048;
    src.connect(micAnalyser);
    document.getElementById('mic-toggle-btn').textContent = '⏹ 마이크 끄기';
    document.getElementById('mic-heard').textContent = '🎤 듣고 있어요! 피아노 건반을 쳐 보세요!';
    listenMicLoop();
  } catch (err) {
    alert('마이크 권한을 허용해 주셔야 피아노 소리를 들을 수 있어요!');
  }
}
function stopPianoMic() {
  if (micRaf) { cancelAnimationFrame(micRaf); micRaf = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const btn = document.getElementById('mic-toggle-btn');
  if (btn) btn.textContent = '🎤 마이크 켜고 듣기 시작';
}
function autoCorrelate(buf, sampleRate) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.02) return -1;
  let r1 = 0, r2 = buf.length - 1, thres = 0.2;
  for (let i = 0; i < buf.length / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < buf.length / 2; i++) if (Math.abs(buf[buf.length - i]) < thres) { r2 = buf.length - i; break; }
  const slice = buf.slice(r1, r2);
  const c = new Array(slice.length).fill(0);
  for (let i = 0; i < slice.length; i++) for (let j = 0; j < slice.length - i; j++) c[i] += slice[j] * slice[j + i];
  let d = 0; while (d < c.length - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < c.length; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  if (maxpos <= 0) return -1;
  return sampleRate / maxpos;
}
function freqToMidi(hz) { return Math.round(12 * (Math.log(hz / 440) / Math.log(2))) + 69; }
function listenMicLoop() {
  if (!micStream || !micAnalyser) return;
  const buf = new Float32Array(micAnalyser.fftSize);
  micAnalyser.getFloatTimeDomainData(buf);
  const hz = autoCorrelate(buf, getCtx().sampleRate);
  if (hz > 60 && hz < 2000 && !micLocked) {
    const heardMidi = freqToMidi(hz);
    const targetMidi = freqToMidi(micQuestions[micIdx].hz);
    const noteKr = NOTE_NAMES_KR[heardMidi % 12];
    const oct = Math.floor(heardMidi / 12) - 1;
    document.getElementById('mic-heard').textContent = `🎵 들린 음: ${noteKr} (${oct}옥타브)`;
    if (heardMidi === targetMidi) {
      micLocked = true;
      micScore += 15;
      sfxCorrect();
      saveStudentScore(getCurrentStudent(), 15);
      const fb = document.getElementById('mic-feedback');
      fb.classList.remove('hidden', 'fb-no'); fb.classList.add('fb-ok');
      fb.textContent = `딩동댕! 🎉 정확한 ${micQuestions[micIdx].cLabel || micQuestions[micIdx].solfege}예요!`;
      document.getElementById('mic-score-pill').textContent = `⭐ ${micScore}점`;
      setTimeout(() => {
        micIdx++;
        if (micIdx >= micQuestions.length) {
          stopPianoMic();
          showOnly('result-screen');
          document.getElementById('trophy-icon').textContent = '🎹';
          document.getElementById('result-title').textContent = `${getCurrentStudent()} 피아노 박사!`;
          document.getElementById('result-desc').textContent = `실제 피아노 연주 ${micQuestions.length}문제를 마쳐서 ${micScore}점을 얻었어요!`;
          document.getElementById('result-wrongs').classList.add('hidden');
        } else {
          renderMicQuestion();
        }
      }, 1200);
    }
  }
  micRaf = requestAnimationFrame(listenMicLoop);
}
function skipMicQuestion() {
  micIdx++;
  if (micIdx >= micQuestions.length) {
    stopPianoMic();
    showOnly('result-screen');
    document.getElementById('trophy-icon').textContent = '🎹';
    document.getElementById('result-title').textContent = `${getCurrentStudent()} 수고했어요!`;
    document.getElementById('result-desc').textContent = `총 ${micScore}점을 기록했어요!`;
    document.getElementById('result-wrongs').classList.add('hidden');
  } else {
    renderMicQuestion();
  }
}

function openRanking() {
  showOnly('ranking-screen');
  const data = JSON.parse(localStorage.getItem('goun_records') || '{}');
  const entries = Object.entries(data).sort((a, b) => b[1].total - a[1].total);
  const list = document.getElementById('rank-list');
  if (!entries.length) {
    list.innerHTML = '<div class="rank-row"><span>아직 기록이 없어요! 첫 게임을 시작해 보세요 🎹</span></div>';
  } else {
    list.innerHTML = entries.map(([name, info], idx) => {
      const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}위`;
      return `<div class="rank-row"><span>${medal} ${name}</span><span>총 ${info.total}점 (최고 ${info.best}점 · ${info.plays}회)</span></div>`;
    }).join('');
  }
  const ws = document.getElementById('wrong-student-select');
  ws.innerHTML = '';
  const cur = getCurrentStudent();
  STUDENTS.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    if (n === cur) o.selected = true;
    ws.appendChild(o);
  });
  renderWrongReport();
}
function renderWrongReport() {
  const name = document.getElementById('wrong-student-select').value;
  const all = JSON.parse(localStorage.getItem('goun_wrongs') || '{}');
  const box = document.getElementById('wrong-report');
  const st = all[name];
  if (!st || !Object.keys(st).length) {
    box.innerHTML = `<h3>📝 ${name} 학생 오답·종합평가</h3><div>아직 틀린 기록이 없어요! 👍</div>`;
    return;
  }
  let total = 0;
  const stageTotals = [], itemTotals = [];
  Object.entries(st).forEach(([stage, items]) => {
    let stageSum = 0;
    Object.entries(items).forEach(([item, info]) => {
      stageSum += info.count;
      itemTotals.push({ item, count: info.count });
    });
    total += stageSum;
    stageTotals.push({ stage, sum: stageSum });
  });
  const worstStage = stageTotals.slice().sort((a, b) => b.sum - a.sum)[0];
  const topItems = itemTotals.slice().sort((a, b) => b.count - a.count).slice(0, 3)
    .map(x => `${x.item}(${x.count}회)`).join(', ');
  let html = `<h3>📝 ${name} 학생 오답·종합평가</h3>`;
  html += `<div class="wrong-summary">📊 총 ${total}회 오답 · 가장 많이 틀린 단계: <strong>${worstStage.stage}</strong> (${worstStage.sum}회)<br>👉 다시 복습하면 좋은 것: <strong>${topItems}</strong></div>`;
  html += `<div style="font-weight:800; color:#73563d;">▸ 단계별 오답 정리</div>`;
  Object.entries(st).forEach(([stage, items]) => {
    html += `<div style="margin-top:6px; font-weight:800; color:#73563d;">▸ ${stage}</div>`;
    Object.entries(items).forEach(([item, info]) => {
      html += `<div class="wrong-item">• <strong>${item}</strong> (${info.count}회 오답): ${info.hint}</div>`;
    });
  });
  box.innerHTML = html;
}
function clearRecords() {
  if (confirm('이 기기에 저장된 모든 학생 점수·오답 기록을 초기화할까요?')) {
    localStorage.removeItem('goun_records');
    localStorage.removeItem('goun_wrongs');
    localStorage.removeItem('goun_unlocks');
    applyLockUI();
    openRanking();
  }
}

initStudentSelects();
initCharPicks();
